<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arwS" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b45309"/>
    </marker>
    <marker id="arwB" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="940" height="700" fill="#ffffff"/>
  <text x="470" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">CPU Block Diagram — Team 02 (16-bit, 256-word RAM)</text>

  <!-- legend -->
  <g font-size="12" fill="#334155">
    <line x1="640" y1="52" x2="676" y2="52" stroke="#334155" stroke-width="2" marker-end="url(#arw)"/>
    <text x="682" y="56">data / address path</text>
    <line x1="640" y1="70" x2="676" y2="70" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arwS)"/>
    <text x="682" y="74">control signal</text>
  </g>

  <!-- ============ CONTROL UNIT ============ -->
  <rect x="360" y="70" width="230" height="56" rx="6" fill="#fde68a" stroke="#334155" stroke-width="1.5"/>
  <text x="475" y="94" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">CONTROL UNIT</text>
  <text x="475" y="113" text-anchor="middle" font-size="12" fill="#334155">decode &amp; sequencing (fetch→decode→execute)</text>

  <!-- ============ SPECIAL REGISTERS ============ -->
  <g stroke="#334155" stroke-width="1.2">
    <rect x="360" y="152" width="110" height="42" rx="4" fill="#e0e7ff"/>
    <rect x="480" y="152" width="110" height="42" rx="4" fill="#e0e7ff"/>
    <rect x="360" y="202" width="110" height="42" rx="4" fill="#e0e7ff"/>
    <rect x="480" y="202" width="110" height="42" rx="4" fill="#e0e7ff"/>
  </g>
  <g text-anchor="middle" fill="#0f172a">
    <text x="415" y="178" font-size="15" font-weight="700">IR</text>
    <text x="535" y="178" font-size="15" font-weight="700">PC</text>
    <text x="415" y="228" font-size="15" font-weight="700">SP</text>
    <text x="535" y="222" font-size="13" font-weight="700">FLAGS</text>
    <text x="535" y="237" font-size="11" fill="#475569">Z  N  C  V</text>
  </g>

  <!-- ============ REGISTER FILE ============ -->
  <rect x="60" y="270" width="190" height="210" rx="6" fill="#bfdbfe" stroke="#334155" stroke-width="1.5"/>
  <text x="155" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">REGISTER FILE</text>
  <text x="155" y="314" text-anchor="middle" font-size="12" fill="#334155">16 × 16-bit</text>
  <g font-size="12" fill="#0f172a" text-anchor="middle">
    <rect x="80"  y="326" width="66" height="26" fill="#ffffff" stroke="#64748b"/><text x="113" y="344">R0</text>
    <rect x="164" y="326" width="66" height="26" fill="#ffffff" stroke="#64748b"/><text x="197" y="344">R1</text>
    <rect x="80"  y="358" width="66" height="26" fill="#ffffff" stroke="#64748b"/><text x="113" y="376">R2</text>
    <rect x="164" y="358" width="66" height="26" fill="#ffffff" stroke="#64748b"/><text x="197" y="376">R3</text>
    <text x="155" y="406" font-size="13" fill="#475569">⋮</text>
    <rect x="80"  y="416" width="66" height="26" fill="#ffffff" stroke="#64748b"/><text x="113" y="434">R14</text>
    <rect x="164" y="416" width="66" height="26" fill="#ffffff" stroke="#64748b"/><text x="197" y="434">R15</text>
  </g>

  <!-- ============ ALU ============ -->
  <polygon points="380,300 560,300 560,340 490,375 450,375 380,340" fill="#bbf7d0" stroke="#334155" stroke-width="1.5"/>
  <text x="470" y="324" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">ALU</text>
  <text x="470" y="343" text-anchor="middle" font-size="10" fill="#334155">ADD SUB MUL DIV AND</text>
  <text x="470" y="357" text-anchor="middle" font-size="10" fill="#334155">OR NOT SHL SHR CMP</text>

  <!-- ============ RAM ============ -->
  <rect x="710" y="150" width="200" height="360" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="810" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">RAM — 256 × 16</text>
  <g stroke="#334155" stroke-width="1">
    <rect x="730" y="192" width="160" height="70" fill="#fef9c3"/>
    <rect x="730" y="262" width="160" height="70" fill="#dbeafe"/>
    <rect x="730" y="332" width="160" height="70" fill="#dcfce7"/>
    <rect x="730" y="402" width="160" height="90" fill="#fde2e4"/>
  </g>
  <g font-size="12" fill="#0f172a">
    <text x="740" y="215" font-weight="700">TEXT</text>  <text x="884" y="215" text-anchor="end" fill="#475569">00–3F</text>
    <text x="740" y="285" font-weight="700">DATA</text>  <text x="884" y="285" text-anchor="end" fill="#475569">40–7F</text>
    <text x="740" y="355" font-weight="700">HEAP</text>  <text x="884" y="355" text-anchor="end" fill="#475569">80–BF</text>
    <text x="740" y="425" font-weight="700">STACK</text> <text x="884" y="425" text-anchor="end" fill="#475569">C0–FF</text>
    <text x="740" y="470" font-size="11" fill="#475569">SP starts FF, grows ↓</text>
  </g>

  <!-- ============ DATA BUS ============ -->
  <rect x="60" y="560" width="850" height="30" rx="6" fill="#334155"/>
  <text x="485" y="580" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">16-bit INTERNAL DATA BUS</text>

  <!-- ===================== CONNECTIONS ===================== -->
  <!-- PC -> RAM (address) -->
  <path d="M590,165 L708,185" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arw)"/>
  <text x="628" y="167" font-size="11" fill="#334155">address</text>

  <!-- SP -> RAM (stack addr) -->
  <path d="M590,223 L708,240" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arw)"/>
  <text x="620" y="245" font-size="11" fill="#334155">stack addr</text>

  <!-- RAM -> IR (instruction) : route under the special regs -->
  <path d="M730,262 C640,300 560,275 472,196" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arw)"/>
  <text x="600" y="300" font-size="11" fill="#334155">instruction →IR</text>

  <!-- IR -> Control (decode) -->
  <path d="M415,152 L440,128" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arw)"/>
  <text x="300" y="140" font-size="11" fill="#334155">opcode/fields →decode</text>

  <!-- Control -> units (control signals, dashed) -->
  <path d="M470,126 C300,150 230,210 200,266" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arwS)"/>
  <path d="M500,126 C520,200 500,250 480,296" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arwS)"/>
  <path d="M560,100 C700,110 800,120 812,146" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arwS)"/>
  <text x="250" y="200" font-size="11" fill="#b45309">control signals</text>

  <!-- RegFile -> ALU (operands A,B) -->
  <path d="M250,330 L376,316" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arw)"/>
  <text x="280" y="320" font-size="11" fill="#334155">operand A</text>
  <path d="M250,372 L376,338" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arw)"/>
  <text x="280" y="372" font-size="11" fill="#334155">operand B</text>

  <!-- ALU -> RegFile (result write-back) -->
  <path d="M450,374 C360,420 300,410 250,400" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arw)"/>
  <text x="300" y="432" font-size="11" fill="#334155">result (write-back)</text>

  <!-- ALU -> FLAGS -->
  <path d="M520,305 C540,280 536,262 536,246" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arw)"/>
  <text x="545" y="290" font-size="11" fill="#334155">flags</text>

  <!-- RegFile <-> BUS -->
  <path d="M150,480 L150,558" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arw)" marker-start="url(#arwB)"/>
  <text x="156" y="524" font-size="11" fill="#334155">load / store</text>

  <!-- RAM <-> BUS -->
  <path d="M810,510 L810,558" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arw)" marker-start="url(#arwB)"/>

  <!-- ALU -> BUS (result onto bus for ST) -->
  <path d="M470,375 L470,558" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arw)"/>
</svg>
